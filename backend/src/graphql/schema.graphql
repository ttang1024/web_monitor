scalar DateTime
scalar JSON

enum ErrorStatus {
  Unresolved
  Resolved
  Ignored
  Regressed
}

"""
The ingestion credential a page's SDK authenticates with. Returned in full to
authenticated members of the owning tenant — there is no other way to install
the SDK.
"""
type ApiKey {
  id: ID!
  name: String!
  key: String!
  environment: String!
  isActive: Boolean!
  lastUsedAt: DateTime
  expiresAt: DateTime
  createdAt: DateTime!
}

type Tenant {
  id: ID!
  name: String!
  domain: String!
  plan: String!
  isActive: Boolean!
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  role: String!
  tenantId: ID!
}

type AuthPayload {
  token: String!
  refreshToken: String!
  user: User!
  tenant: Tenant!
}

type ErrorLog {
  id: ID!
  type: String!
  message: String!
  stackTrace: String
  source: String
  lineNumber: Int
  columnNumber: Int
  url: String!
  userAgent: String!
  timestamp: Float!
  errorHash: String!
  occurrenceCount: Int!
  status: ErrorStatus!
  lastSeenAt: DateTime!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime
}

type ErrorStatusCounts {
  unresolved: Int!
  resolved: Int!
  ignored: Int!
  regressed: Int!
}

type ErrorTrendPoint {
  bucketStart: DateTime!
  count: Int!
}

type ApiErrorLog {
  id: ID!
  type: String!
  requestUrl: String!
  method: String!
  statusCode: Int
  errorMessage: String
  pageUrl: String!
  userAgent: String!
  timestamp: Float!
  createdAt: DateTime!
}

type ApiErrorPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [ApiErrorLog!]!
}

type CustomEventLog {
  id: ID!
  eventName: String!
  url: String!
  timestamp: Float!
  data: JSON
  userId: String
  sessionId: String
  createdAt: DateTime!
}

type CustomEventPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [CustomEventLog!]!
}

type BusinessFlowStat {
  flow: String!
  total: Int!
  completed: Int!
  failed: Int!
  timedOut: Int!
  abandoned: Int!
  avgDurationMs: Float!
}

type WebVitals {
  lcp: Float
  fcp: Float
  cls: Float
  fid: Float
  ttfb: Float
  sampleCount: Int!
}

type BreakdownSlice {
  name: String!
  count: Int!
}

type ErrorPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [ErrorLog!]!
}

type TrendData {
  labels: [String!]!
  values: [Float!]!
}

type TopError {
  errorHash: String!
  type: String!
  message: String!
  count: Int!
  lastSeen: DateTime!
}

type PagePerformance {
  url: String!
  avgLoadTime: Float!
  sampleCount: Int!
}

type DashboardStats {
  totalErrors: Int!
  totalEvents: Int!
  avgLoadTime: Float!
  errorRate: Float!
  errorTrend: TrendData!
  performanceTrend: TrendData!
  topErrors: [TopError!]!
  topSlowPages: [PagePerformance!]!
}

type PerformanceTimeSeriesPoint {
  timestamp: DateTime!
  avgLoadTime: Float!
  avgTTFB: Float!
  avgLCP: Float!
  avgFCP: Float!
  count: Int!
}

type DashboardLayout {
  id: ID!
  userId: ID!
  name: String!
  isDefault: Boolean!
  configuration: JSON
  createdAt: DateTime!
  updatedAt: DateTime
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
  tenantName: String!
  domain: String!
}

input LoginInput {
  email: String!
  password: String!
}

input CreateApiKeyInput {
  name: String!
  environment: String = "production"
}

input SaveLayoutInput {
  name: String!
  isDefault: Boolean!
  configuration: JSON
}

input PerformanceMetricsInput {
  lcp: Float
  fcp: Float
  cls: Float
  fid: Float
  ttfb: Float
  dns: Float
  tcp: Float
  response: Float
  dom: Float
  load: Float
}

input DeviceInfoInput {
  type: String
  browser: String
  os: String
  country: String
}

input IngestErrorInput {
  type: String!
  message: String!
  stack: String
  source: String
  lineNo: Int
  colNo: Int
  url: String!
  userAgent: String!
  timestamp: Float!
  metadata: JSON
}

input IngestPerformanceInput {
  url: String!
  userAgent: String!
  timestamp: Float!
  metrics: PerformanceMetricsInput!
  device: DeviceInfoInput
}

input IngestApiErrorInput {
  type: String!
  requestUrl: String!
  method: String!
  status: Int
  message: String
  url: String!
  userAgent: String!
  timestamp: Float!
  requestHeaders: JSON
  responseHeaders: JSON
}

input IngestCustomEventInput {
  name: String!
  url: String!
  userAgent: String!
  timestamp: Float!
  data: JSON!
  userId: String
  sessionId: String
}

input BatchIngestInput {
  errors: [IngestErrorInput!]
  performance: [IngestPerformanceInput!]
  apiErrors: [IngestApiErrorInput!]
  customEvents: [IngestCustomEventInput!]
}

type Query {
  me: User!
  myTenant: Tenant!
  apiKeys: [ApiKey!]!
  dashboardStats(startDate: DateTime, endDate: DateTime): DashboardStats!
  errors(
    page: Int = 1
    pageSize: Int = 50
    type: String
    status: ErrorStatus
    search: String
    startDate: DateTime
  ): ErrorPage!
  errorStatusCounts: ErrorStatusCounts!
  errorDetails(id: ID!): ErrorLog!
  "Hourly occurrence counts for one error group, zero-filled."
  errorTimeSeries(errorHash: String!, hours: Int = 24): [ErrorTrendPoint!]!
  performanceTimeSeries(
    startDate: DateTime
    endDate: DateTime
    url: String
    interval: String = "hour"
  ): [PerformanceTimeSeriesPoint!]!
  "P75 of each Web Vital over the window."
  webVitals(startDate: DateTime, endDate: DateTime): WebVitals!
  deviceBreakdown(dimension: String = "browser", startDate: DateTime, endDate: DateTime): [BreakdownSlice!]!
  apiErrors(page: Int = 1, pageSize: Int = 50, startDate: DateTime): ApiErrorPage!
  customEvents(page: Int = 1, pageSize: Int = 50, name: String, startDate: DateTime): CustomEventPage!
  "Completion/failure rates per business flow tracked with startFlow()."
  businessFlows(startDate: DateTime, endDate: DateTime): [BusinessFlowStat!]!
  dashboardLayouts: [DashboardLayout!]!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  "Exchanges a refresh token for a new session; the old token is rotated out."
  refreshSession(refreshToken: String!): AuthPayload!
  "Revokes the given refresh token, or every session for the user when omitted."
  logout(refreshToken: String): Boolean!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!

  createApiKey(input: CreateApiKeyInput!): ApiKey!
  revokeApiKey(id: ID!): ApiKey!

  updateErrorStatus(id: ID!, status: ErrorStatus!): ErrorLog!

  saveDashboardLayout(input: SaveLayoutInput!): DashboardLayout!
  deleteDashboardLayout(id: ID!): Boolean!

  ingestError(input: IngestErrorInput!): Boolean!
  ingestPerformance(input: IngestPerformanceInput!): Boolean!
  ingestApiError(input: IngestApiErrorInput!): Boolean!
  ingestCustomEvent(input: IngestCustomEventInput!): Boolean!
  ingestBatch(input: BatchIngestInput!): Boolean!
}

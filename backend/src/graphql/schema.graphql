scalar DateTime
scalar JSON

enum ErrorStatus {
  Unresolved
  Resolved
  Ignored
  Regressed
}

enum AlertCondition {
  "An error hash reported for the first time inside the window."
  NewIssue
  "Total error occurrences in the window exceeded the threshold."
  ErrorSpike
  "Errors as a percentage of all events in the window exceeded the threshold."
  ErrorRate
  "Average page load time over the window exceeded the threshold, in ms."
  SlowPageLoad
}

enum UserRole {
  User
  "Manages API keys, alert rules and team membership."
  Admin
}

enum AlertSeverity {
  Info
  Warning
  Critical
}

"""
The ingestion credential a page's SDK authenticates with. Returned in full to
authenticated members of the owning tenant — there is no other way to install
the SDK.
"""
type ApiKey {
  id: ID!
  name: String!
  key: String!
  environment: String!
  isActive: Boolean!
  lastUsedAt: DateTime
  expiresAt: DateTime
  "Origins permitted to ingest with this key. Empty means any origin."
  allowedOrigins: [String!]!
  createdAt: DateTime!
}

type Tenant {
  id: ID!
  name: String!
  domain: String!
  plan: String!
  isActive: Boolean!
  maxUsers: Int!
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  role: UserRole!
  tenantId: ID!
  isActive: Boolean!
  lastLoginAt: DateTime
}

"""
A short-lived access token. The refresh token is set as an httpOnly cookie and
is never exposed to page script.
"""
type AuthPayload {
  token: String!
  user: User!
  tenant: Tenant!
}

type ErrorLog {
  id: ID!
  type: String!
  message: String!
  stackTrace: String
  source: String
  lineNumber: Int
  columnNumber: Int
  url: String!
  userAgent: String!
  timestamp: Float!
  errorHash: String!
  occurrenceCount: Int!
  status: ErrorStatus!
  lastSeenAt: DateTime!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime
}

type ErrorStatusCounts {
  unresolved: Int!
  resolved: Int!
  ignored: Int!
  regressed: Int!
}

type ErrorTrendPoint {
  bucketStart: DateTime!
  count: Int!
}

type ApiErrorLog {
  id: ID!
  type: String!
  requestUrl: String!
  method: String!
  statusCode: Int
  errorMessage: String
  pageUrl: String!
  userAgent: String!
  timestamp: Float!
  createdAt: DateTime!
}

type ApiErrorPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [ApiErrorLog!]!
}

"An endpoint whose successful responses the SDK reported as slow."
type SlowRequestStat {
  method: String!
  "The request URL without its query string."
  url: String!
  count: Int!
  avgDurationMs: Float!
  maxDurationMs: Float!
}

type BusinessFlowStat {
  flow: String!
  total: Int!
  completed: Int!
  failed: Int!
  timedOut: Int!
  abandoned: Int!
  avgDurationMs: Float!
}

"Totals for one event name sent with captureCustomEvent()."
type CustomEventStat {
  name: String!
  count: Int!
  "Distinct user ids set with setUser(); events without one are not counted."
  users: Int!
  lastSeen: DateTime!
}

"Summary of one numeric metric sent with captureMetric()."
type CustomMetricStat {
  name: String!
  count: Int!
  avg: Float!
  min: Float!
  max: Float!
}

type CustomMetricPoint {
  timestamp: DateTime!
  avg: Float!
  count: Int!
}

type CustomEventLog {
  id: ID!
  eventName: String!
  url: String!
  timestamp: Float!
  data: JSON
  userId: String
  sessionId: String
  createdAt: DateTime!
}

type CustomEventPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [CustomEventLog!]!
}

type WebVitals {
  lcp: Float
  fcp: Float
  cls: Float
  "Interaction to Next Paint, in ms."
  inp: Float
  ttfb: Float
  sampleCount: Int!
}

type BreakdownSlice {
  name: String!
  count: Int!
}

type ErrorPage {
  total: Int!
  page: Int!
  pageSize: Int!
  data: [ErrorLog!]!
}

type TrendData {
  labels: [String!]!
  values: [Float!]!
}

type TopError {
  errorHash: String!
  type: String!
  message: String!
  count: Int!
  lastSeen: DateTime!
}

type PagePerformance {
  url: String!
  avgLoadTime: Float!
  sampleCount: Int!
}

type DashboardStats {
  "Error occurrences in the window (hourly granularity)."
  totalErrors: Int!
  "Errors + page views + API errors + custom events."
  totalEvents: Int!
  pageViews: Int!
  avgLoadTime: Float!
  errorRate: Float!
  errorTrend: TrendData!
  performanceTrend: TrendData!
  topErrors: [TopError!]!
  topSlowPages: [PagePerformance!]!
}

type PerformanceTimeSeriesPoint {
  timestamp: DateTime!
  avgLoadTime: Float!
  avgTTFB: Float!
  avgLCP: Float!
  avgFCP: Float!
  "Page views in the bucket."
  count: Int!
}

type AlertRule {
  id: ID!
  name: String!
  condition: AlertCondition!
  "Occurrences (ErrorSpike), percent (ErrorRate), or milliseconds (SlowPageLoad). Ignored by NewIssue."
  threshold: Float!
  windowMinutes: Int!
  severity: AlertSeverity!
  isEnabled: Boolean!
  "Quiet period after the rule fires, so a persistently true condition alerts once."
  cooldownMinutes: Int!
  lastTriggeredAt: DateTime
  webhookUrl: String
  createdAt: DateTime!
  updatedAt: DateTime
}

"One firing of a rule. Recorded even when webhook delivery fails."
type AlertNotification {
  id: ID!
  alertRuleId: ID!
  ruleName: String!
  title: String!
  body: String!
  severity: AlertSeverity!
  observedValue: Float!
  threshold: Float!
  "Set for NewIssue alerts, so the dashboard can link to the issue."
  errorHash: String
  isRead: Boolean!
  deliveredAt: DateTime
  deliveryError: String
  createdAt: DateTime!
}

type AlertNotificationPage {
  total: Int!
  page: Int!
  pageSize: Int!
  unread: Int!
  data: [AlertNotification!]!
}

input AlertRuleInput {
  name: String!
  condition: AlertCondition!
  threshold: Float = 0
  windowMinutes: Int = 60
  severity: AlertSeverity = Warning
  cooldownMinutes: Int = 60
  webhookUrl: String
  isEnabled: Boolean = true
}

input UpdateAlertRuleInput {
  name: String
  condition: AlertCondition
  threshold: Float
  windowMinutes: Int
  severity: AlertSeverity
  cooldownMinutes: Int
  webhookUrl: String
  isEnabled: Boolean
}

type DashboardLayout {
  id: ID!
  userId: ID!
  name: String!
  isDefault: Boolean!
  configuration: JSON
  createdAt: DateTime!
  updatedAt: DateTime
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
  tenantName: String!
  domain: String!
}

input LoginInput {
  email: String!
  password: String!
}

input CreateApiKeyInput {
  name: String!
  environment: String = "production"
}

input SaveLayoutInput {
  name: String!
  isDefault: Boolean = false
  configuration: JSON
}

input CreateUserInput {
  email: String!
  firstName: String!
  lastName: String!
  role: UserRole = User
  "Handed to the new member out of band; they change it after signing in."
  initialPassword: String!
}

input UpdateUserInput {
  role: UserRole
  isActive: Boolean
}

"The window to analyse; the metrics are read server-side from the tenant's own data."
input AIAnalysisInput {
  timeRange: String!
  startDate: DateTime
  endDate: DateTime
}

type AIAnalysis {
  summary: String!
  recommendations: [String!]!
  severity: String!
}

type Query {
  users: [User!]!
  apiKeys: [ApiKey!]!
  dashboardStats(startDate: DateTime, endDate: DateTime): DashboardStats!
  errors(
    page: Int = 1
    pageSize: Int = 50
    type: String
    status: ErrorStatus
    search: String
    startDate: DateTime
  ): ErrorPage!
  errorStatusCounts: ErrorStatusCounts!
  "Hourly occurrence counts for one error group, zero-filled."
  errorTimeSeries(errorHash: String!, hours: Int = 24): [ErrorTrendPoint!]!
  performanceTimeSeries(
    startDate: DateTime
    endDate: DateTime
    url: String
    interval: String = "hour"
  ): [PerformanceTimeSeriesPoint!]!
  "P75 of each Web Vital over the window."
  webVitals(startDate: DateTime, endDate: DateTime): WebVitals!
  deviceBreakdown(dimension: String = "browser", startDate: DateTime, endDate: DateTime): [BreakdownSlice!]!
  "Failed requests only; slow successful requests are in slowRequests."
  apiErrors(page: Int = 1, pageSize: Int = 50, startDate: DateTime): ApiErrorPage!
  slowRequests(startDate: DateTime, endDate: DateTime): [SlowRequestStat!]!
  "Completion/failure rates per business flow tracked with startFlow()."
  businessFlows(startDate: DateTime, endDate: DateTime): [BusinessFlowStat!]!
  "Custom events per name, excluding the SDK's own metric and business_flow events."
  customEventStats(startDate: DateTime, endDate: DateTime): [CustomEventStat!]!
  customMetricStats(startDate: DateTime, endDate: DateTime): [CustomMetricStat!]!
  customMetricTimeSeries(
    metric: String!
    startDate: DateTime
    endDate: DateTime
    interval: String = "hour"
  ): [CustomMetricPoint!]!
  "Recent occurrences, newest first. Without a name, excludes metric and business_flow events."
  customEvents(page: Int = 1, pageSize: Int = 50, name: String, startDate: DateTime, endDate: DateTime): CustomEventPage!
  dashboardLayouts: [DashboardLayout!]!
  alertRules: [AlertRule!]!
  alertNotifications(page: Int = 1, pageSize: Int = 50, unreadOnly: Boolean = false): AlertNotificationPage!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  "Exchanges the refresh cookie for a new session; the old token is rotated out."
  refreshSession: AuthPayload!
  "Ends this session, or every session of the user with everywhere: true."
  logout(everywhere: Boolean = false): Boolean!

  "Admin only."
  createUser(input: CreateUserInput!): User!
  "Admin only. Deactivating a user ends their sessions."
  updateUser(id: ID!, input: UpdateUserInput!): User!

  "Admin only, as are the other key and alert-rule mutations."
  createApiKey(input: CreateApiKeyInput!): ApiKey!
  revokeApiKey(id: ID!): ApiKey!
  "Restricts which origins may ingest with this key. An empty list means any origin."
  setApiKeyAllowedOrigins(id: ID!, origins: [String!]!): ApiKey!

  createAlertRule(input: AlertRuleInput!): AlertRule!
  updateAlertRule(id: ID!, input: UpdateAlertRuleInput!): AlertRule!
  deleteAlertRule(id: ID!): Boolean!
  "Marks the given notifications read, or every unread one when ids are omitted."
  markAlertNotificationsRead(ids: [ID!]): Int!

  updateErrorStatus(id: ID!, status: ErrorStatus!): ErrorLog!

  saveDashboardLayout(input: SaveLayoutInput!): DashboardLayout!

  "Runs an AI analysis of the caller's own metrics for the window."
  analyzeDashboardMetrics(input: AIAnalysisInput!): AIAnalysis!
}

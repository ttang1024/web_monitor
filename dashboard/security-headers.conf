# Included in every location: nginx drops server-level add_header directives in
# any location that sets its own, so they are repeated here rather than inherited.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The CSP itself is in index.html's <meta>, generated at build with the API origin.
# frame-ancestors can't be set from a meta tag, hence X-Frame-Options above.
